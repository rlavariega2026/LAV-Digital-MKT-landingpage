name: Publicar LAV Digital en Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/deploy-hostinger.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente FTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validar archivo y secretos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          test -s index.html
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secreto $name o está vacío."
              exit 1
            fi
          done
          grep -Fq '777 441 8793' index.html
          grep -Fq '$350 MXN' index.html
          if grep -Fq '777 107 9192' index.html; then
            echo "::error::El archivo todavía contiene el WhatsApp anterior."
            exit 1
          fi

      - name: Publicar únicamente index.html en public_html del dominio
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          TARGET_DIR="public_html"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 1
          set net:timeout 30
          set cmd:fail-exit yes
          cd "$TARGET_DIR"
          put index.html -o index.html
          bye
          EOF
          echo "Publicado únicamente index.html en $TARGET_DIR/index.html"

name: Diagnosticar ruta FTP de Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ftp-connection-test.yml'

jobs:
  diagnose-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente FTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Identificar carpeta real del sitio
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT FTP_SERVER_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secreto $name o está vacío."
              exit 1
            fi
          done
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 1
          set net:timeout 20
          set cmd:fail-exit yes
          echo "DIRECTORIO INICIAL FTP:"
          pwd
          echo "CONTENIDO DEL DIRECTORIO INICIAL:"
          cls -la
          echo "VALOR CONFIGURADO EN FTP_SERVER_DIR:"
          cd "$FTP_SERVER_DIR"
          pwd
          echo "CONTENIDO DE FTP_SERVER_DIR:"
          cls -la
          echo "ARCHIVOS index.html EN LA RUTA CONFIGURADA:"
          find . -name index.html
          bye
          EOF

name: Diagnosticar raíz real del dominio en Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ftp-connection-test.yml'

jobs:
  diagnose-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente FTP
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Comparar carpetas candidatas sin modificar archivos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-allow no
          set net:max-retries 1
          set net:timeout 20
          set cmd:fail-exit yes
          echo "FTP HOME"
          pwd
          cls -la
          echo "CARPETA domains"
          cd domains
          pwd
          cls -la
          echo "DOMINIO lavdigitalmkt.com"
          cd lavdigitalmkt.com
          pwd
          cls -la
          echo "RAIZ PUBLIC_HTML DEL DOMINIO"
          cd public_html
          pwd
          cls -la
          echo "REGRESO FTP HOME"
          cd /
          pwd
          echo "CARPETA public_html DIRECTA"
          cd public_html
          pwd
          cls -la
          echo "FIN DEL DIAGNOSTICO"
          bye
          EOF

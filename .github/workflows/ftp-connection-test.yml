name: Diagnosticar ruta FTP de Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ftp-connection-test.yml'

jobs:
  diagnose-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente FTP
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Inspeccionar public_html desde la raíz FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-allow no
          set net:max-retries 1
          set net:timeout 20
          set cmd:fail-exit yes
          echo "RAIZ FTP"
          pwd
          echo "PUBLIC_HTML DIRECTO"
          cd public_html
          pwd
          cls -la
          echo "FIN"
          bye
          EOF

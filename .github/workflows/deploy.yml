name: Deploy LAV Tarjetas NFC to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tarjetas-nfc
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy landing page via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: domains/lavdigitalmkt.com/public_html/tarjetas-nfc/
          exclude: |
            **/.git*
            **/.github/**
            **/README.md
